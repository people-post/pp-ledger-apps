name: build

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Windows: the wallet ships there (projects/wallet-app WL008); every app is built to keep the code
        # portable.
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        # SDL3 is built from source (pp-cpp-ui): X11 and OpenGL headers; Xvfb + Mesa for the UI smoke.
        run: >
          sudo apt-get update && sudo apt-get install -y ccache ninja-build
          libx11-dev libxext-dev libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev libxfixes-dev
          libxrender-dev libxss-dev libgl-dev libgl1-mesa-dri xvfb xauth

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ccache ninja

      - name: Compiler (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install tools (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja nasm ccache --no-progress -y
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ matrix.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', '.github/workflows/build.yml') }}-${{ github.sha }}
          # The build files' hash first; failing that, any earlier cache of this OS — most objects
          # (the dependencies') are unchanged by a pin or CMake edit, and ccache checks each one.
          restore-keys: |
            ccache-${{ matrix.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', '.github/workflows/build.yml') }}-
            ccache-${{ matrix.os }}-

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPP_APPS_DEV_HOOKS=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache

      - name: Build
        run: cmake --build build -j 4
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache

      - name: Test
        run: ctest --test-dir build --output-on-failure
